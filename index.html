<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prepify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500&family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <button class="site-brand" id="homeNav" type="button" aria-label="Prepify home">
        Prep<em>ify</em>
      </button>
      <nav class="site-nav" aria-label="Primary navigation">
        <button id="libraryNav" class="admin-only" type="button" hidden>Library</button>
        <button id="journeyNav" class="admin-only" type="button" hidden>Journey</button>
      </nav>
      <div class="site-actions">
        <button class="lang-btn" id="langBtn">EN</button>
        <button class="auth-btn" id="authBtn">Đăng nhập</button>
      </div>
    </header>

    <section class="home-view" id="homeView">
      <div class="home-copy">
        <p class="home-kicker" id="homeKicker">PREPIFY · READING DESK</p>
        <h1 id="homeTitle">Một nơi yên tĩnh để đọc, học và suy nghĩ rõ ràng.</h1>
      </div>
    </section>

    <div class="app-shell" id="libraryView" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="progress-global">
          <div class="pg-bar"><div class="pg-fill" id="pgFill"></div></div>
          <div class="pg-label"><span id="pgText">0 / 0</span><span id="pgPct">0%</span></div>
        </div>
        <nav class="topics" id="topics"></nav>
      </aside>

      <main class="main">
        <div class="topbar">
          <button class="menu-btn" id="menuBtn">☰</button>
          <div class="title">
            <h2 id="tTitle">—</h2>
            <span id="tSub"></span>
          </div>
          <input class="search" id="search" placeholder="Tìm câu hỏi…" />
          <button class="filter-fav-btn" id="favFilterBtn" title="Câu hỏi yêu thích">♥</button>
          <div class="toggle" id="quizToggle">Quiz mode</div>
          <button class="daily-btn" id="dailyBtn">
            Daily <span class="daily-count" id="dailyCount">—</span>
          </button>
          <button class="lb-btn" id="lbBtn">Leaderboard</button>
        </div>
        <div class="content" id="content">
          <div class="content-inner" id="inner"></div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
